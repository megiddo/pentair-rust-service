[package]
name = "pentairservice"
version = "0.1.0"
edition = "2021"
description = "Long-running Pentair bus owner service (Linux)"
license = "MIT"
publish = false

[lib]
name = "pentairservice"
path = "src/lib.rs"

[[bin]]
name = "pentairservice"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
axum = "0.8"
fastrand = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "io-util", "sync", "fs"] }
tokio-serial = "5.4"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
