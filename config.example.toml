# Example config for pentairservice (B4).
# Copy to config.toml or point PENTAIR_CONFIG at a path.
# Leave transport_url empty/unset to idle without opening a transport.

# Bind address for the local HTTP API
bind_addr = "0.0.0.0:8080"

# Transport Strategy URL (owned by a single bus Actor task; persistent connection):
#   tcp://192.168.1.50:8899          — EW11 / TCP bridge
#   /dev/ttyUSB0                     — serial (default baud 9600)
#   serial:/dev/ttyUSB0?baud=9600    — serial with baud
#   replay:fixtures/status_temps.hex — recorded fixture (lab / tests)
# Empty / omitted → service starts and serves /health without connecting.
# transport_url = "tcp://192.168.1.50:8899"

# Log level filter (also overridable via RUST_LOG)
# log_level = "info"

# Append-only frame journal on the bind-mounted volume (B4).
# Path is relative to the container WORKDIR (/workspace) unless absolute.
# Compatible with replacing PHP signal/ ingest later: each line ends with
# lowercase hex of framed bytes (same as bin2hex of the raw frame).
# journal_path = "data/frames.journal"
# Soft size cap (bytes); vacuum keeps trailing complete lines when exceeded.
# journal_max_bytes = 10485760
# Soft age cap (seconds); age trim is a stub (config accepted, no-op vacuum).
# journal_max_age_secs = 604800

# Write gate (B5). Default OFF — POST /command dry-runs with fixture ACK verdicts
# so CI never needs a live controller. Set true only for lab / production TX.
# writes_enabled = false
# Post-TX listen window (ms) for ACK / status classification.
# listen_window_ms = 500
